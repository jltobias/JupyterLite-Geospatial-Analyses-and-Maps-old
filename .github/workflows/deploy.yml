name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build JupyterLite site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            jupyterlite-core \
            jupyterlite-pyodide-kernel \
            jupyterlab

      - name: Build JupyterLite site
        run: |
          jupyter lite build --contents notebooks --output-dir dist

      - name: Copy repository data and helper files into site
        run: |
          mkdir -p dist/files
          if [ -d data ]; then cp -R data dist/files/data; fi
          if [ -f spatial_lite.py ]; then cp spatial_lite.py dist/files/spatial_lite.py; fi
          if [ -f elements.csv ]; then cp elements.csv dist/files/elements.csv; fi
          if [ -f README.md ]; then cp README.md dist/files/README.md; fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
